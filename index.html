<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>落日寂境 · Sundown Silence</title>
<style>
:root{--bg:#0a0b10;--ink:#eadfc4;--dim:#a39b84;--amber:#ffb26b;--moss:#8fc274;--panel:rgba(12,14,18,.9);--line:rgba(255,178,107,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{--bg:#0a0b10}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;overflow:hidden}
.layer{position:absolute;inset:-5% -6%;will-change:transform}
.layer svg{position:absolute;inset:0;width:100%;height:100%}
#sky{background:linear-gradient(#171629 0%,#4a2b44 30%,#b0524a 55%,#e68f58 70%,#2a1f2b 100%)}
#sun{background:radial-gradient(circle at 70% 62%,#fff0c4 0,#ffc67a 3%,rgba(255,150,70,.55) 9%,rgba(255,120,60,.15) 24%,transparent 45%)}
canvas{position:absolute;inset:0;width:100%;height:100%}
#fx{pointer-events:none;mix-blend-mode:screen}
#g{cursor:pointer;touch-action:none}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 45%,rgba(0,0,0,.7) 100%),linear-gradient(transparent 70%,rgba(8,8,14,.85))}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.13;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:gr .8s steps(3) infinite}

#hud em{font-style:normal;color:var(--amber)}

.card h2{font-family:"Noto Serif TC","Songti TC",Georgia,serif;font-weight:400;font-size:26px;letter-spacing:.15em;margin:6px 0 2px}
.tag{font-size:11px;letter-spacing:.25em;color:var(--amber)}
.bar{height:3px;background:rgba(255,255,255,.1);margin:16px 0}.bar div{height:100%;width:0;background:var(--amber);transition:width 1.8s linear}
.log{font-size:12px;color:var(--dim);line-height:1.9;min-height:3.8em}
.rep{display:none}.rep.on{display:block;animation:fi .8s}@keyframes fi{from{opacity:0}}
dl{display:grid;grid-template-columns:7em 1fr;gap:6px 12px;font-size:13px;margin:12px 0}dt{color:var(--dim)}

.note b{display:block;font:400 11px ui-monospace,monospace;letter-spacing:.25em;color:var(--moss);margin-bottom:4px}
.x{position:absolute;right:14px;top:12px;background:none;border:1px solid var(--line);color:var(--ink);padding:4px 12px;cursor:pointer;font:12px inherit}
.x:hover{background:var(--amber);color:#000}
#toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);z-index:5;padding:12px 26px;border:1px solid var(--moss);background:rgba(10,14,10,.85);letter-spacing:.2em;font-size:14px;opacity:0;transition:opacity .6s;pointer-events:none;text-align:center}
#nsky{background:linear-gradient(#05060f,#0d1330 40%,#2a2347 68%,#14101c);opacity:0}
#tint{position:absolute;inset:0;pointer-events:none;background:rgba(12,18,55,.42);mix-blend-mode:multiply;opacity:0}
#tools{position:absolute;right:clamp(14px,3vw,34px);top:calc(46px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:3}

#tools button:hover,.ch:hover{background:var(--amber);color:#000}
.ch{display:block;width:100%;margin-top:10px;line-height:1.7;font-size:15px}
.ch small{display:block;color:var(--dim);font-size:12px;letter-spacing:.05em}
.ch:hover small{color:#222}
@media (prefers-reduced-motion:reduce){.grain,#scan.on{animation:none}}
</style>
</head>
